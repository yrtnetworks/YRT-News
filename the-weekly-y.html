<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c45116">
<meta name="description" content="The Weekly Y: the Yahya Kemal College–Struga campus magazine. Read every issue.">
<link rel="icon" type="image/png" href="the_weekly_y-icon.png">
<title>The Weekly Y | Every issue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#c45116;--deep:#3a1606;--sun:#ffd9b8;--paper:#fffaf3;--serif:"DM Serif Display",Georgia,serif;--sans:"Work Sans","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--orange);color:var(--deep);font:17px/1.55 var(--sans)}
a{color:inherit}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
h1,h2,h3,p{margin-top:0;overflow-wrap:break-word}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding:16px clamp(18px,4vw,56px);color:#fff;font-weight:500}
.bar a{text-underline-offset:4px}
.masthead{display:flex;align-items:center;gap:clamp(16px,3vw,40px);padding:clamp(20px,4vw,50px) clamp(18px,4vw,56px) clamp(30px,5vw,60px);color:#fff}
.masthead img{width:clamp(90px,16vw,200px);height:auto;flex:none}
.masthead h1{font:400 clamp(54px,11vw,150px)/.88 var(--serif);letter-spacing:-.035em;margin:0}
.masthead p{margin:14px 0 0;font-size:19px;max-width:30em}
.shelf{background:var(--sun);padding:clamp(28px,5vw,64px) clamp(18px,4vw,56px) 70px;min-height:50vh}
.shelf h2{font:400 clamp(30px,4vw,48px)/1 var(--serif);margin-bottom:26px}
.latest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--deep);color:var(--sun);padding:clamp(22px,3vw,40px);margin-bottom:46px;max-width:900px}
.latest h3{font:400 clamp(26px,3.6vw,44px)/1.05 var(--serif);margin:0 0 6px}
.latest p{margin:0}
.btn{display:inline-block;padding:11px 24px;border:2px solid currentColor;border-radius:99px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sun);color:var(--deep)}
.docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.doc a{display:block;position:relative;background:var(--paper);padding:26px 22px 22px;min-height:210px;text-decoration:none;clip-path:polygon(0 0,calc(100% - 38px) 0,100% 38px,100% 100%,0 100%);box-shadow:inset 0 -6px 0 var(--orange);transition:transform .2s}
.doc a::after{content:"";position:absolute;top:0;right:0;width:38px;height:38px;background:var(--orange);clip-path:polygon(0 0,0 100%,100% 100%)}
.doc a:hover{transform:translateY(-6px) rotate(-1deg)}
.tag{display:inline-block;background:#2b579a;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:3px;margin-bottom:34px}
.doc h3{font:400 24px/1.15 var(--serif);margin:0 0 6px}
.doc p{margin:0;font-size:15px}
.msg{max-width:36em;padding:24px;border:2px dashed var(--deep)}
footer{background:var(--deep);color:var(--sun);padding:20px clamp(18px,4vw,56px);font-size:14px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
@media(max-width:560px){.masthead{flex-direction:column;align-items:flex-start}.latest{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.doc a{transition:none}.doc a:hover{transform:none}}
</style>
</head>
<body>
<div class="bar"><a href="index.html">Back to YRT Network</a><span>Yahya Kemal College–Struga</span></div>

<header class="masthead">
  <img src="the_weekly_y-icon.png" alt="The Weekly Y logo">
  <div>
    <h1>The Weekly Y</h1>
    <p>Puzzles, trivia, student art and lighter reads. A new issue every week.</p>
  </div>
</header>

<main class="shelf">
  <div id="latest"></div>
  <h2>All issues</h2>
  <ul class="docs" id="issues"><li class="msg">Loading issues…</li></ul>
</main>

<footer><span>© <span id="year"></span> The Weekly Y · YRT Network</span><span>Issues open as Word documents.</span></footer>

<script>
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
// "2026-10-23" -> "23/10/2026"
const ddmmyyyy = (d) => d.split("-").reverse().join("/");

async function load() {
  const list = document.getElementById("issues");
  try {
    const r = await fetch("issues.json");
    if (!r.ok) throw new Error();
    const issues = (await r.json()).sort((a, b) => b.date.localeCompare(a.date));
    list.replaceChildren();
    if (!issues.length) return list.append(el("li", "msg", "No issues yet. The first one is coming soon."));

    const name = (i) => `The Weekly Y - ${ddmmyyyy(i.date)}`;

    const n = issues[0];
    const box = document.getElementById("latest");
    const text = el("div");
    text.append(el("h3", "", name(n)), el("p", "", "Newest issue"));
    const open = el("a", "btn", "Open newest issue");
    open.href = n.file;
    box.className = "latest";
    box.append(text, open);

    issues.forEach((i) => {
      const li = el("li", "doc");
      const a = el("a");
      a.href = i.file;
      a.setAttribute("download", "");
      a.append(el("span", "tag", "DOCX"), el("h3", "", name(i)));
      a.append(el("p", "", i.note || "Open the issue"));
      li.append(a);
      list.append(li);
    });
  } catch (e) {
    list.replaceChildren(el("li", "msg", "Could not load issues.json. Check that it sits in the same folder as this page and the site is served over HTTP/HTTPS."));
  }
}
load();
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
